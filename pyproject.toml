[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rl-schedule-optimizer"
version = "0.2.0"
description = "Évaluation et optimisation (RL vs OR) de programmes de vols mono-hub"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Daniel Gabaï", email = "gabaidaniel0@gmail.com" }]
dependencies = [
    "fastapi>=0.142.2",
    "numpy>=2.0",
    "polars>=1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
rl = [
    "gymnasium>=1.0",
    "stable-baselines3>=2.4",
    "sb3-contrib>=2.4",
    "torch>=2.5",
    "tensorboard",
]

[project.scripts]
schedule-optimizer = "schedule_optimizer.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/schedule_optimizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]
ignore = ["B905"]

[project.urls]
Repository = "https://github.com/gabaid971/rl-schedule-optimizer"
